<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RakibOne8 | Events</title>
  </head>
  <body>
    <h1>RakibOne</h1>
    <button id="stop">Stop</button>
  </body>
  <script>
    const sayRakib = () => {
      console.log("Rakib");
    };
    setTimeout(sayRakib, 2000);

    const changeText = () => {
      document.querySelector("h1").innerHTML =
        "You are Doing Amazing Rakib..Keep moving forward.. Tatakae!";
    };

    const changeMe = setTimeout(changeText,2000)
    // setInterval(sayRakib,1000)

    document.querySelector('#stop').addEventListener('click',()=>{
        clearTimeout(changeMe)
    })
  </script>
</html>
